# PIPELINE DEFINITION
# Name: mahjong-discard-training
# Inputs:
#    batch_size: int [Default: 512.0]
#    epochs: int [Default: 10.0]
#    num_layers: int [Default: 50.0]
components:
  comp-train-discard:
    executorLabel: exec-train-discard
    inputDefinitions:
      parameters:
        batch_size:
          defaultValue: 512.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        data_dir:
          parameterType: STRING
        epochs:
          defaultValue: 10.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        log_dir:
          parameterType: STRING
        num_layers:
          defaultValue: 50.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        output_dir:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-train-discard:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_discard
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_discard(\n    data_dir: str,\n    output_dir: str,\n  \
          \  log_dir: str,\n    num_layers: int = 50,\n    epochs: int = 10,\n   \
          \ batch_size: int = 512,\n):\n    import subprocess, sys\n    subprocess.run([\n\
          \        sys.executable, '/app/sl_train/train_discard_model.py',\n     \
          \   '--num_layers', str(num_layers),\n        '--epochs', str(epochs),\n\
          \        '--batch_size', str(batch_size),\n        '--data-dir', data_dir,\n\
          \        '--output-dir', output_dir,\n        '--log-dir', log_dir,\n  \
          \  ], check=True)\n\n"
        image: harbor.macaroni-tet.ts.net/mahjong-ai/training:latest
        resources:
          accelerator:
            count: '1'
            resourceCount: '1'
          cpuRequest: 4.0
          memoryRequest: 17.179869184
          resourceCpuRequest: '4'
          resourceMemoryRequest: 16Gi
pipelineInfo:
  name: mahjong-discard-training
root:
  dag:
    tasks:
      train-discard:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-discard
        inputs:
          parameters:
            batch_size:
              componentInputParameter: batch_size
            data_dir:
              runtimeValue:
                constant: /data
            epochs:
              componentInputParameter: epochs
            log_dir:
              runtimeValue:
                constant: /output/logs/discard
            num_layers:
              componentInputParameter: num_layers
            output_dir:
              runtimeValue:
                constant: /output/checkpoints/discard
        taskInfo:
          name: train-discard
  inputDefinitions:
    parameters:
      batch_size:
        defaultValue: 512.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      epochs:
        defaultValue: 10.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      num_layers:
        defaultValue: 50.0
        isOptional: true
        parameterType: NUMBER_INTEGER
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-train-discard:
          emptyDirMounts:
          - medium: Memory
            mountPath: /dev/shm
            sizeLimit: 8Gi
            volumeName: dshm
          imagePullSecret:
          - secretName: harbor-creds
            secretNameParameter:
              runtimeValue:
                constant: harbor-creds
          pvcMount:
          - constant: data-pvc
            mountPath: /data
            pvcNameParameter:
              runtimeValue:
                constant: data-pvc
          - constant: output-pvc
            mountPath: /output
            pvcNameParameter:
              runtimeValue:
                constant: output-pvc
