# PIPELINE DEFINITION
# Name: mahjong-reward-training
# Inputs:
#    epochs: int [Default: 10.0]
#    hidden_dims: int [Default: 50.0]
#    num_layers: int [Default: 2.0]
components:
  comp-train-reward:
    executorLabel: exec-train-reward
    inputDefinitions:
      parameters:
        data_dir:
          parameterType: STRING
        epochs:
          defaultValue: 10.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        hidden_dims:
          defaultValue: 50.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        log_dir:
          parameterType: STRING
        num_layers:
          defaultValue: 2.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        output_dir:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-train-reward:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_reward
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_reward(\n    data_dir: str,\n    output_dir: str,\n   \
          \ log_dir: str,\n    hidden_dims: int = 50,\n    num_layers: int = 2,\n\
          \    epochs: int = 10,\n):\n    import subprocess, sys\n    subprocess.run([\n\
          \        sys.executable, '/app/sl_train/train_reward.py',\n        '--hidden_dims',\
          \ str(hidden_dims),\n        '--num_layers', str(num_layers),\n        '--epochs',\
          \ str(epochs),\n        '--data-dir', data_dir,\n        '--output-dir',\
          \ output_dir,\n        '--log-dir', log_dir,\n    ], check=True)\n\n"
        image: harbor.macaroni-tet.ts.net/mahjong-ai/training:latest
        resources:
          cpuRequest: 4.0
          memoryRequest: 17.179869184
          resourceCpuRequest: '4'
          resourceMemoryRequest: 16Gi
pipelineInfo:
  name: mahjong-reward-training
root:
  dag:
    tasks:
      train-reward:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-reward
        inputs:
          parameters:
            data_dir:
              runtimeValue:
                constant: /data
            epochs:
              componentInputParameter: epochs
            hidden_dims:
              componentInputParameter: hidden_dims
            log_dir:
              runtimeValue:
                constant: /output/logs/reward
            num_layers:
              componentInputParameter: num_layers
            output_dir:
              runtimeValue:
                constant: /output/checkpoints/reward
        taskInfo:
          name: train-reward
  inputDefinitions:
    parameters:
      epochs:
        defaultValue: 10.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      hidden_dims:
        defaultValue: 50.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      num_layers:
        defaultValue: 2.0
        isOptional: true
        parameterType: NUMBER_INTEGER
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-train-reward:
          imagePullSecret:
          - secretName: harbor-creds
            secretNameParameter:
              runtimeValue:
                constant: harbor-creds
          pvcMount:
          - constant: data-pvc
            mountPath: /data
            pvcNameParameter:
              runtimeValue:
                constant: data-pvc
          - constant: output-pvc
            mountPath: /output
            pvcNameParameter:
              runtimeValue:
                constant: output-pvc
